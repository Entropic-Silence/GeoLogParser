    status: acquired_rights_verified_structural_inventory_matched_renderer_disagreement_human_review_pending
    verification_notes: "Official anonymous files API reported one ZIP, file ID 2d647e02-1f14-4d8a-968d-43fd235367a4, SHA256 c262d83a255a64e5d8e285fe327204f430022856fe66b9ac3b61b9e67ebc1a16. Download matched. Archive has 33 valid DWG headers across eight folders. A pinned LibreDWG 0.14 single-file audit confirmed a Chinese comprehensive borehole column with geological descriptions, but also found a named company and named mining-area/project title; its SVG conversion warned that MTEXT was ignored. A subsequent automatic text/risk pre-screen converted all 33 with dwgread minJSON, found Chinese text in all 33, and conservatively risk-flagged 30/33. Review-only DXF/PNG derivatives exist for MENDELEY_DWG_009–011. An automated v002 entity reconciliation matched source-DWG and derivative-DXF modelspace inventories exactly: 1,244/1,244, 1,905/1,905, and 7,173/7,173 entity handles, including ordered text hashes for 363, 537, and 611 text entities. A separate raster audit found the LibreDWG-SVG images for 009/010 were explicit invalid-geometry placeholders; for 011, the two nonblank renderers had normalized foreground IoU 0.0005905677887454653 and two-pixel-tolerance bidirectional F1 0.003955665965985095. Installed LibreCAD 2.1.3 exposes no batch export flag, and offscreen GUI-start probes created no exports. These diagnostics show unresolved renderer disagreement, not which derivative is correct. Font correctness, privacy, sensitive locations, third-party content, human visual completeness, and benchmark eligibility remain unresolved. This is not counted as PDF/JPG/PNG benchmark data."

