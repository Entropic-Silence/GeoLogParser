[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geologparser"
version = "0.0.1"
description = "Geology-constrained structured extraction from legacy borehole logs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GeoLogParser contributors"}]
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.18,<5"]
pdf = ["PyMuPDF>=1.24,<2"]
ocr = []
dev = ["pytest>=8,<9", "jsonschema>=4.18,<5", "PyYAML>=6,<7"]

[project.scripts]
geologparser-baseline = "geologparser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
