[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geologparser"
version = "0.0.1"
description = "Geology-constrained structured extraction from legacy borehole logs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GeoLogParser contributors"}]
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.18,<5"]
pdf = ["PyMuPDF>=1.24,<2"]
ocr = []
ocr-rapidocr = ["rapidocr_onnxruntime==1.4.4", "onnxruntime==1.23.2"]
annotation = ["fastapi==0.141.1", "uvicorn[standard]==0.52.1"]
export = ["openpyxl==3.1.5", "pyarrow==21.0.0", "shapely==2.1.2", "pyogrio==0.11.1", "pyproj==3.7.1"]
paper3-3d = ["pyvista==0.48.4", "vtk==9.6.2"]
dev = ["pytest>=8,<9", "jsonschema>=4.18,<5", "PyYAML>=6,<7"]
test = [
  "pytest>=8,<9",
  "jsonschema>=4.18,<5",
  "PyYAML>=6,<7",
  "Pillow==11.3.0",
  "numpy==2.2.6",
  "opencv-python>=4.9,<5",
  "PyMuPDF==1.28.2",
  "openpyxl>=3.1,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "matplotlib==3.10.5",
  "fonttools==4.63.0",
  "pyarrow>=18,<22",
  "shapely>=2,<3",
  "pyproj>=3.6,<4",
  "pyogrio>=0.10,<1",
  "ezdxf==1.4.3",
  "CairoSVG==2.8.2",
  "reportlab==4.5.1",
  "rapidocr_onnxruntime==1.4.4",
  "onnxruntime==1.23.2",
]

[project.scripts]
geologparser-baseline = "geologparser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
