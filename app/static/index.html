<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoLogParser Annotation</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>GeoLogParser Annotation</h1>
    <select id="annotation-list"></select>
    <label>Annotator <input id="annotator" value="local-reviewer"></label>
    <select id="status">
      <option value="single_verified">single_verified</option>
      <option value="double_verified">double_verified</option>
      <option value="expert_verified">expert_verified</option>
      <option value="auto">auto</option>
    </select>
    <button id="validate">Validate</button>
    <button id="confirm-all">Confirm all fields</button>
    <button id="start-review">Start timer</button>
    <button id="save">Save revision</button>
    <span id="message"></span>
  </header>
  <main>
    <section id="viewer">
      <div id="image-stage"><img id="panel-image" alt="borehole panel"><div id="highlight"></div></div>
    </section>
    <section id="editor">
      <div id="progress">Loading Ground Truth status…</div>
      <div id="gate-status"></div>
      <div class="exports">
        <button data-format="json">Download JSON</button>
        <button data-format="csv">Download CSV</button>
        <button data-format="xlsx">Download XLSX</button>
        <button id="download-verified">Download verified GT JSONL</button>
      </div>
      <div id="reread-panel">
        <strong>Selected numeric field:</strong> <code id="selected-field">none</code>
        <button id="reread-field" disabled>Re-read ROI</button>
        <button id="apply-reread" disabled>Apply proposal locally</button>
        <img id="reread-roi" alt="Re-read ROI evidence">
        <pre id="reread-output">Select a numeric field with pixel evidence.</pre>
      </div>
      <h2>Borehole fields</h2>
      <div id="borehole-fields"></div>
      <h2>Intervals</h2>
      <table><thead><tr><th>ID</th><th>Top</th><th>Bottom</th><th>Thickness</th><th>Code</th><th>Lithology</th><th>Description</th><th>Action</th></tr></thead><tbody id="intervals"></tbody></table>
      <button id="add-interval">Add interval</button>
      <h2>Validation</h2>
      <pre id="validation-output">Not run</pre>
      <h2>Review queue</h2>
      <pre id="review-output">Not loaded</pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
